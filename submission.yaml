submission:
  title: "GridVision AI — Intelligent Grid Load Optimisation & Renewable Diagnostic Advisor"

  problem_statement: >
    Grid operators and renewable energy asset managers face extreme net-load volatility
    and operational uncertainty as intermittent solar and wind generation collides with
    steep consumer demand ramps. Without coordinated real-time decision support, massive
    amounts of clean power are curtailed — over 8 TWh shut off in the US in 2023 alone —
    while hardware-level faults in solar inverters and wind turbines go undetected for
    weeks, silently eroding generation capacity and threatening grid stability.

  solution_summary: >
    GridVision AI is an end-to-end grid load optimisation and renewable diagnostic advisor
    that ingests 24-hour SCADA telemetry, computes net load and ramp-rate forecasts,
    runs physics-informed Performance Ratio diagnostics to isolate asset-level faults with
    root-cause labels, optimises Battery Energy Storage System dispatch to eliminate
    curtailment, and leverages IBM watsonx.ai Granite-3 to synthesise all quantitative
    outputs into shift-ready Bottom-Line-Up-Front (BLUF) operational briefs — all rendered
    in a responsive white-theme SaaS dashboard that judges can run with a single command.

  key_features:
    - "Dual-horizon net load & ramp forecasting: detects evening demand spikes exceeding 50 MW/hr before they strain grid stability"
    - "Autonomous BESS curtailment optimisation: dynamically schedules charge/discharge cycles to absorb midday renewable surplus and avoid clean-energy waste"
    - "Physics-informed asset anomaly diagnosis: cross-references solar irradiance and inverter telemetry against Performance Ratio thresholds to flag root causes (thermal clipping, soiling, pitch degradation)"
    - "Agentic BLUF operator briefs powered by IBM watsonx.ai granite-3-8b-instruct: synthesises complex multi-variable grid metrics into structured, actionable shift memos"
    - "Interactive white-theme SaaS dashboard: live Chart.js 24-hour visualisation, BESS dispatch table, alarm filters, Day/Month/Year period toggle, Sun Hour sparkline, Summary panel with CO₂ reduction, and drag-and-drop CSV telemetry ingestion"

  tech_stack:
    languages: ["Python 3.10+", "HTML5", "CSS3", "JavaScript (ES2022)"]
    frameworks: ["Flask 3.0", "Pandas 2.0", "NumPy 1.26", "Chart.js 4.4"]
    ibm_technologies: ["IBM watsonx.ai (granite-3-8b-instruct)", "IBM Bob IDE (Plan + Agent modes)"]
    databases: []
    other: ["GitHub Actions (CI validation)", "python-dotenv", "ibm-watsonx-ai SDK"]

  what_we_are_most_proud_of: >
    The agentic synthesis pipeline: rather than exposing raw numbers, our analytics engine
    pre-aggregates a dense structured JSON summary of the entire 24-hour grid state and
    forwards it to IBM Granite via the watsonx.ai Python SDK. The model returns a
    structured, paragraph-form BLUF operational memo — the kind a transmission dispatcher
    would read at the start of a shift — in under 2 seconds and with zero hallucination
    risk from raw time-series noise. We are equally proud of the fully self-contained
    white-theme SaaS dashboard that requires zero build steps and runs instantly with
    `python app.py`, giving judges an immediately demonstrable, visually polished product.

  known_limitations: >
    The IBM watsonx.ai BLUF generation falls back to a pre-computed static brief when no
    API key is configured in .env — the dashboard remains fully functional but the AI
    narrative is not live. The Day/Month/Year period toggle scales the 24-hour sample
    data rather than loading real historical time series, which is a hackathon-scope
    simplification. The performance ratio diagnostics use fixed capacity constants rather
    than per-asset rated capacity pulled from a CMMS, meaning the thresholds are
    indicative rather than fleet-calibrated. Authentication and multi-user sessions are
    not implemented — the app is a single-operator demo tool, not a production-hardened
    control-room system.

